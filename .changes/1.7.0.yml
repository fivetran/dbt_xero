version: 1.7.0
pr_number: 88
new_features:
- description: Raises the minimum supported dbt version from v1.3.0 to v1.10.0.
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10.0, the new minimum supported version.
- description: Documents the `_fivetran_synced` column in the `stg_xero__invoice_line_item_has_tracking_category`
    and `stg_xero__journal_line_has_tracking_category` models. Both models already
    returned this column; it is now described in the package documentation.
