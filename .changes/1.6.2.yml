version: 1.6.2
pr_number: 86
bug_fixes:
- description: '`dbt compile` no longer fails on a new schema. The `int_xero__journal_line_pivoted_tracking_categories`, `int_xero__journal_cash_line_pivoted_tracking_categories`, and `int_xero__invoice_line_item_pivoted_tracking_categories` models now look up tracking category names only during `dbt run` and `dbt build`, and query them once instead of twice.'
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10, which the new v1.11.0 minimum supports.
date: '2026-11-12'
