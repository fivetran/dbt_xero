schema_variable_name: "xero_schema"

include_databricks_sql: false
include_sqlserver: false
include_dbt_compile: false

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "features disabled"
    vars:
      xero__using_credit_note: false
      xero__using_bank_transaction: false
      xero__using_invoice_line_item_tracking_category: false
      xero__using_journal_line_tracking_category: false
      xero__using_tracking_categories: false
    include_incremental: false
